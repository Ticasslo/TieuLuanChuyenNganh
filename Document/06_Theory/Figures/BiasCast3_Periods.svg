<text x='140' y='70' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>observed qmax</text>
<text x='140' y='84' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>(gauge data)</text>
<rect x='169.2' y='56' width='710.8' height='36' fill='#3d85c6' stroke='white'/>
<text x='524.6' y='78.0' text-anchor='middle' font-size='10' font-weight='bold' fill='white' font-family='Arial, sans-serif'>measured every day 1981-2017 (37 years)</text>
<rect x='146' y='97' width='734' height='32' fill='white'/>
<text x='150' y='108' font-size='11' fill='#444' font-family='Arial, sans-serif'>Daily maximum discharge measured at the gauge. The test years 2014-2017 are measured too (0.23% missing):</text>
<text x='150' y='121' font-size='11' fill='#444' font-family='Arial, sans-serif'>this is the 'answer key' the forecasts are scored against.</text>
<text x='140' y='162' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>used for</text>
<text x='140' y='176' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>thresholds</text>
<rect x='169.2' y='148' width='633.9' height='36' fill='#cfe2f3' stroke='white'/>
<text x='486.2' y='170.0' text-anchor='middle' font-size='10' font-weight='bold' fill='black' font-family='Arial, sans-serif'>only 1981-2013 (33 years)</text>
<rect x='146' y='189' width='734' height='32' fill='white'/>
<text x='150' y='200' font-size='11' fill='#444' font-family='Arial, sans-serif'>Flood thresholds (1.5/2/5/10-year) and the four flow levels are computed only from these years,</text>
<text x='150' y='213' font-size='11' fill='#444' font-family='Arial, sans-serif'>deliberately stopping before the test years so the thresholds never see the data being scored.</text>
<text x='140' y='254' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>model</text>
<text x='140' y='268' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>periods</text>
<rect x='591.8' y='240' width='134.5' height='36' fill='#38761d' stroke='white'/>
<text x='659.1' y='256.5' text-anchor='middle' font-size='10' font-weight='bold' fill='white' font-family='Arial, sans-serif'>train</text>
<text x='659.1' y='267.5' text-anchor='middle' font-size='10' font-weight='normal' fill='white' font-family='Arial, sans-serif'>2003-2009</text>
<rect x='726.3' y='240' width='76.8' height='36' fill='#e69138' stroke='white'/>
<text x='764.7' y='256.5' text-anchor='middle' font-size='10' font-weight='bold' fill='white' font-family='Arial, sans-serif'>val</text>
<text x='764.7' y='267.5' text-anchor='middle' font-size='10' font-weight='normal' fill='white' font-family='Arial, sans-serif'>2010-2013</text>
<rect x='803.2' y='240' width='76.8' height='36' fill='#c00000' stroke='white'/>
