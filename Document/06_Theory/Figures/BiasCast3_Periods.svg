<text x='862.6' y='354.0' text-anchor='middle' font-size='10' font-weight='bold' fill='white' font-family='Arial, sans-serif'>9 km</text>
<rect x='146' y='373' width='734' height='32' fill='white'/>
<text x='150' y='384' font-size='11' fill='#444' font-family='Arial, sans-serif'>Archived operational forecasts: each year was made by the model version running that year (grid refined Jan 2010 and 8 Mar 2016).</text>
<text x='150' y='397' font-size='11' fill='#444' font-family='Arial, sans-serif'>Train sees only the coarse grid, half of test uses the 9 km grid. The data is not adjusted for these jumps.</text>
<text x='584.2' y='434' text-anchor='middle' font-size='11' font-weight='bold' fill='#1f4e79' font-family='Arial, sans-serif'>Aug 2002 flood</text>
