<text x='841.6' y='267.5' text-anchor='middle' font-size='10' font-weight='normal' fill='white' font-family='Arial, sans-serif'>2014-2017</text>
<rect x='146' y='281' width='734' height='32' fill='white'/>
<text x='150' y='292' font-size='11' fill='#444' font-family='Arial, sans-serif'>train: the model learns its weights.  val: used to pick the best epoch.  test: final score, model vs observed qmax.</text>
<text x='150' y='305' font-size='11' fill='#444' font-family='Arial, sans-serif'>Years before 2003 are never targets; they only serve as the 364-day input history.</text>
<text x='140' y='346' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>ECMWF HRES</text>
<text x='140' y='360' text-anchor='end' font-size='12' font-weight='bold' font-family='Arial, sans-serif'>model grid</text>
