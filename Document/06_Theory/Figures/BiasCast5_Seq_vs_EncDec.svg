<text x='499.5' y='381' text-anchor='middle' font-size='11' font-family='Arial, sans-serif'>(h, c) 256 -> 128 -> 256, linear</text>
<line x1='587' y1='370' x2='607' y2='370' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<rect x='609' y='350' width='175' height='40' rx='5' fill='#f8d7da' stroke='#666'/>
<text x='696.5' y='366' text-anchor='middle' font-size='11' font-weight='bold' font-family='Arial, sans-serif'>LSTM 2, day t only</text>
<text x='696.5' y='381' text-anchor='middle' font-size='11' font-family='Arial, sans-serif'>starts from handoff output</text>
<line x1='784' y1='370' x2='804' y2='370' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<rect x='806' y='350' width='175' height='40' rx='5' fill='#eeeeee' stroke='#666'/>
<text x='893.5' y='366' text-anchor='middle' font-size='11' font-weight='bold' font-family='Arial, sans-serif'>Linear 128 -> 1</text>
<text x='893.5' y='381' text-anchor='middle' font-size='11' font-family='Arial, sans-serif'>qmax of day t</text>
<rect x='609' y='282' width='175' height='40' rx='5' fill='#dff0d8' stroke='#666'/>
<text x='696.5' y='298' text-anchor='middle' font-size='11' font-weight='bold' font-family='Arial, sans-serif'>Forecast embedding</text>
<text x='696.5' y='313' text-anchor='middle' font-size='11' font-family='Arial, sans-serif'>5 ECMWF HRES vars -> 16 (+16)</text>
<line x1='696.5' y1='322' x2='696.5' y2='348' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<text x='18' y='445' font-size='11' fill='#555' font-family='Arial, sans-serif'>(+16) = 16-dim embedding of the 33 basin attributes, appended at every day. Blue = reanalysis input, green = ECMWF HRES forecast of day t, red = where the two models differ.</text>
<text x='18' y='463' font-size='11' fill='#555' font-family='Arial, sans-serif'>Median NSE (Table F1): Sequential 0.63 (simple embedding), Encoder-Decoder 0.57 (complex) / 0.59 (simple); with past discharge qmean: 0.71 vs 0.66.</text>
